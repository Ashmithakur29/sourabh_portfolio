<!-- Contact Section -->
<section id="contact" class="contact" role="region" aria-labelledby="contact-title">
    <div class="container">
        <div class="section-header">
            <h2 id="contact-title" class="section-title">Get In Touch</h2>
            <div class="section-divider"></div>
        </div>
        <div class="contact-content">
            <div class="contact-info">
                <h3>Let's Work Together</h3>
                <p>I'm always interested in new opportunities and exciting projects. Whether you have a question or just want to say hi, feel free to reach out!</p>
                <div class="contact-details">
                    <div class="contact-item">
                        <i class="fas fa-envelope"></i>
                        <span>sourabhsinghyadav@gmail.com</span>
                    </div>
                    <div class="contact-item">
                        <i class="fas fa-map-marker-alt"></i>
                        <span>Bengaluru, Karnataka, India</span>
                    </div>
                </div>
                <div class="social-links">
                    <a href="https://www.linkedin.com/in/sourabh-yadav-ai/" class="social-link" aria-label="LinkedIn profile">
                        <i class="fab fa-linkedin"></i>
                    </a>
            
                </div>
            </div>
            <form class="contact-form" role="form" aria-labelledby="contact-title">
                <div class="form-group">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" required aria-required="true">
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required aria-required="true">
                </div>
                <div class="form-group">
                    <label for="subject">Subject</label>
                    <input type="text" id="subject" name="subject" required aria-required="true">
                </div>
                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="5" required aria-required="true"></textarea>
                </div>
                <button type="submit" class="btn btn-primary">Send Message</button>
            </form>
        </div>
    </div>
</section>
