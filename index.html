    <script src="book_meeting_service/meeting.js"></script>

    <script>
    // Smooth-scroll to #meeting after components load
    (function () {
        if (location.hash !== '#meeting') return;

        const scrollToMeeting = () => {
        const el = document.getElementById('meeting');
        if (el) {
            el.scrollIntoView({ behavior: 'smooth', block: 'start' });
            return true;
        }
        return false;
        };

        if (scrollToMeeting()) return;

        const obs = new MutationObserver(() => {
        if (scrollToMeeting()) obs.disconnect();
        });
        obs.observe(document.documentElement, { childList: true, subtree: true });

        setTimeout(() => obs.disconnect(), 6000);
    })();
    </script>
